aid: metric
name: Metric
description: Metric is an AI-powered financial intelligence and accounting platform
  built for business owners, founders, and CEOs. It replaces spreadsheets and expensive
  CFO teams with a real-time financial dashboard and Max, an AI co-pilot (CF-AI) that
  answers financial questions such as runway, hiring capacity, and spending in plain
  language, drawn from live financial data. Metric handles accounting and bookkeeping,
  payables and receivables, invoicing, eight report types, and UAE VAT compliance,
  and connects to QuickBooks, Zoho Books, Xero, and Shopify. Headquartered in Abu
  Dhabi with offices in Rawalpindi, Singapore, and Riyadh, it is backed by 500 Global
  and serves businesses across 190+ countries. Metric is a SaaS web application with
  no public developer API surface at this time.
